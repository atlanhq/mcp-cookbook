# This repo isn't taking outside contributions yet. Recipes here are a published copy
# of atlan.com/mcp-cookbook — they're written and tested there, then refreshed into
# this repo — and a process for submitting your own recipes is coming soon. Until
# then, any pull request from outside the team gets a polite close explaining why.
#
# GitHub has no setting to turn pull requests off on a public repo. This is the
# next best thing: the response is instant and costs nobody any review time.
#
# "The team" means the PR author is an owner, member or collaborator on this repo,
# per GitHub's author_association. Their PRs are left open.
#
# SECURITY: pull_request_target is required because a fork PR's default token is
# read-only and can't comment or close. It runs in the context of the BASE repo, so
# it must never check out or execute the PR's code — and it doesn't. There is no
# actions/checkout step here, deliberately. Do not add one. Event values are passed
# through env, never interpolated into the script.
name: Close outside PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close if the author is outside the team
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Author is on the team ($AUTHOR_ASSOCIATION), leaving it open."
              exit 0
              ;;
          esac

          gh pr comment "$PR" --repo "$REPO" --body "$(cat <<'MSG'
          Thanks for taking the time to open this.

          This repo isn't taking contributions yet.

          For background: the recipes here are a published copy of
          [atlan.com/mcp-cookbook](https://atlan.com/mcp-cookbook/). They're written and tested
          against a live Atlan tenant there, then refreshed into this repo.

          A process for submitting your own recipes is coming soon; details will be posted in
          this repo's CONTRIBUTING.md. If a recipe is wrong, please raise it
          with your Atlan point of contact.

          This was closed automatically because the repo isn't taking contributions yet, not
          as a judgement on the change itself.
          MSG
          )"

          gh pr close "$PR" --repo "$REPO"
